services:
  # Backend API (from GitHub Container Registry)
  backend:
    image: ghcr.io/hdzajac/qualitative-canvas-backend:latest
    container_name: qualitative-canvas-backend
    restart: unless-stopped
    extra_hosts:
      - "host-gateway:host-gateway"

    environment:
      # Database — point PGHOST to your native Postgres instance (e.g. host-gateway or the VM IP)
      PGHOST: ${PGHOST:?PGHOST must be set in .env}
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      
      # Server
      PORT: 5002
      NODE_ENV: production
      
      # Security (required — set these in .env)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET must be set in .env}
      
      # CORS — allow requests from the production domain
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set in .env}
      
      # Optional: Whisper API
      WHISPER_API_URL: ${WHISPER_API_URL:-}
      
      # Optional: Diarization
      WORKER_AUTO_FALLBACK: ${WORKER_AUTO_FALLBACK}
      AUTO_DIARIZATION_ASSIGN: ${AUTO_DIARIZATION_ASSIGN}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - media_files:/app/data/media
    ports:
      - "${BACKEND_PORT}:5002"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (from GitHub Container Registry)
  frontend:
    image: ghcr.io/hdzajac/qualitative-canvas-frontend:latest
    container_name: qualitative-canvas-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set in .env}/api
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker for transcription (from GitHub Container Registry)
  worker:
    image: ghcr.io/hdzajac/qualitative-canvas-worker:latest
    container_name: qualitative-canvas-worker
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: http://backend:5002/api
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET must be set in .env}
      POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL}
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      # Optional: Hugging Face token for speaker diarization
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - worker_models:/root/.cache

volumes:
  media_files:
    driver: local
  worker_models:
    driver: local

networks:
  default:
    name: qualitative-canvas-network
